<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#14322A">
<title>Aluguel — Gestão de Casas</title>
<meta name="description" content="Gestão de imóveis, contratos, pagamentos e atendimento em um só lugar.">
<meta name="robots" content="noindex,nofollow">

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Estilos. tokens.css vem primeiro: define raio, espaço, tipo e as
     cores dos 4 temas. Todos os outros consomem esses tokens. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="minha-casa.css">
<link rel="stylesheet" href="aluguel-ui.css">
<link rel="stylesheet" href="vitrine.css">
<link rel="stylesheet" href="crm.css">
<link rel="stylesheet" href="motion.css">
<!-- Mapa da Vitrine. Usa o cdnjs, que o CSP já confia para o jsPDF,
     em vez de abrir um domínio novo. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<!-- PWA: instalável; mantém a interface básica em cache -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aluguel">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <!-- Primeiro alvo do Tab: pula a navegação e vai ao conteúdo. -->
  <a class="skip-link" href="#app">Pular para o conteúdo</a>
  <div id="app" tabindex="-1"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <!-- Anuncia a troca de tela para leitor de tela. Num app de página
       única a navegação não recarrega nada, então sem isto a pessoa
       clica e não recebe nenhuma confirmação de que mudou de lugar. -->
  <div id="anuncioTela" class="sr-only" role="status" aria-live="polite"></div>
  <input type="file" id="importInput" accept="application/json,.json" hidden>
  <input type="file" id="photoInput" accept="image/*" multiple hidden>
  <input type="file" id="vitrineFotoInput" accept="image/*" multiple hidden>
  <input type="file" id="vitrineLogoInput" accept="image/jpeg,image/png,image/webp" hidden>

  <!-- Biblioteca do Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7"></script>
  <!-- jsPDF para recibos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Leaflet (mapa da Vitrine). Se não carregar, a Vitrine continua
       funcionando; só o mapa deixa de aparecer. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" onerror="console.warn('Leaflet indisponível: o mapa da Vitrine não será exibido.')"></script>

  <!-- Módulos do app (a ordem importa) -->
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="supabase.js"></script>
  <script src="offline.js"></script>
  <script src="auth.js"></script>
  <script src="commercial.js"></script>
  <script src="minha-casa.js"></script>
  <script src="vitrine.js"></script>
  <script src="features.js"></script>
  <script src="dashboard.js"></script>
  <script src="houses.js"></script>
  <script src="maintenance.js"></script>
  <script src="pending.js"></script>
  <script src="owners.js"></script>
  <script src="tenants.js"></script>
  <script src="interests.js"></script>
  <script src="crm.js"></script>
  <script src="contracts.js"></script>
  <script src="finance.js"></script>
  <script src="photos.js"></script>
  <script src="documents.js"></script>
  <script src="energy.js"></script>
  <script src="portal.js"></script>
  <script src="reports.js"></script>
  <script src="calendar.js"></script>
  <script src="backup.js"></script>
  <script src="app.js"></script>
  <!-- Camada de movimento (fluidez) — depois de app.js -->
  <script src="motion.js"></script>

  <!-- Liga os inputs de arquivo -->
  <script>
    document.getElementById('importInput').addEventListener('change', function(){
      if(this.files && this.files[0]) handleImportFile(this.files[0]);
      this.value = '';
    });
    document.getElementById('photoInput').addEventListener('change', function(){
      const houseId = this.dataset.houseId;
      const chamadoId = this.dataset.chamadoId || '';
      const momento = this.dataset.momento || '';
      if(houseId && this.files.length){
        handlePhotoFiles(houseId, this.files, chamadoId?{chamadoId:chamadoId,momento:momento}:null);
      }
      this.value = '';
      delete this.dataset.chamadoId; delete this.dataset.momento;
    });
    document.getElementById('vitrineFotoInput').addEventListener('change', function(){
      const imovelId = this.dataset.imovelId;
      if(imovelId && this.files.length) handleVitrineFotoFiles(imovelId, this.files);
      this.value = '';
    });
    document.getElementById('vitrineLogoInput').addEventListener('change', function(){
      if(this.files && this.files[0] && typeof handleVitrineLogoFile==='function'){
        handleVitrineLogoFile(this.files[0]);
      }
      this.value='';
    });

    // Registra o service worker (PWA instalável e cache da interface)
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('service-worker.js').catch(function(err){
          console.warn('Service worker não registrou:', err);
        });
      });
    }
  </script>
</body>
</html>
